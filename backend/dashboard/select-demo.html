<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下拉选择试填 · 求职助手</title>
  <link rel="stylesheet" href="/dashboard/style.css">
  <style>
    h1 { margin-bottom: 12px; }
    h2 { margin-top: 0; }
    p { line-height: 1.7; }
    a { color: #2457d6; }
    .muted { color: #626b78; }
    .demo-select { position: relative; min-width: 0; }
    .demo-select input:not([type="hidden"]) { width: 100%; box-sizing: border-box; background: white; }
    .demo-select input[aria-expanded="true"] { border-color: #2457d6; outline: 2px solid #2457d633; }
    .demo-options { position: absolute; z-index: 10; top: calc(100% + 5px); left: 0; right: 0; background: white; border: 1px solid #c7ccd3; border-radius: 8px; max-height: 220px; overflow-y: auto; padding: 6px; box-shadow: 0 6px 18px #0002; }
    .demo-option, .demo-empty { padding: 10px 12px; border-radius: 5px; }
    .demo-option { cursor: pointer; }
    .demo-option:hover, .demo-option:focus { background: #edf2ff; outline: none; }
    .demo-option[aria-selected="true"] { font-weight: 650; color: #176b38; }
    .demo-empty { color: #626b78; }
    .selection-status { font-size: 13px; color: #626b78; line-height: 1.5; overflow-wrap: anywhere; }
    .selection-status[data-selected="true"] { color: #176b38; }
    .education-card { border: 1px solid #e0e3e8; border-radius: 10px; margin: 18px 0 0; padding: 18px; min-width: 0; }
    .education-card legend { font-weight: 700; padding: 0 8px; }
    .education-card .profile-grid { margin: 0; }
    .notice { border-left: 3px solid #9aabc6; padding-left: 12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>下拉选择试填</h1>
      <p>在安装插件的 Edge 或 Chrome 中打开本页，点击插件的“智能填写当前页面”或“填写普通字段”。本页不提供投递按钮，也不保存填写结果。</p>
      <p><a href="/">返回素材库</a> · <a href="/dashboard/demo.html">项目与附件试填</a></p>
    </header>
    <section>
      <h2>求职意向</h2>
      <p class="muted">两个下拉框各选择一个城市。插件应按你保存的意向顺序选择，并避免重复；仅输入搜索词不会显示“已选择”。</p>
      <div id="cityFields" class="profile-grid"></div>
    </section>
    <section>
      <h2>教育经历</h2>
      <p class="muted">下面最多展示你已保存的两条教育经历。学校和专业的候选项来自本机资料，仅用于验证下拉框操作，并非招聘网站的完整学校数据库。</p>
      <p id="educationNotice" class="notice" role="status">正在读取本机保存的教育经历……</p>
      <div id="educationCards"></div>
    </section>
    <p class="muted">“已选择”及对应代码表示真正点击了候选项。学校、学历、专业和日期初始均为空，等待你使用插件试填。刷新页面可重新开始。</p>
  </main>
  <script src="/dashboard/select-demo.js"></script>
</body>
</html>
