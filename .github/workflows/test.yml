name: test
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      AGENT_PROVIDER: mock
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.lock
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python scripts/check.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t interview-agent:test .
      - name: Container health smoke test
        run: |
          docker run -d --name interview-smoke -p 127.0.0.1:8765:8765 -e AGENT_PROVIDER=mock interview-agent:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8765/api/health; then exit 0; fi
            sleep 1
          done
          docker logs interview-smoke
          exit 1
